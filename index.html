<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>基礎日語二｜第1～3課｜50題互動測驗</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#26324a;font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif;line-height:1.65}.shell{max-width:900px;margin:auto;padding:24px 16px 90px}.hero{background:linear-gradient(110deg,#244c70,#407a98);color:white;border-radius:20px;padding:24px 28px}.hero h1{margin:0 0 8px;font-size:clamp(23px,4vw,32px)}.muted{opacity:.85}.toolbar{position:sticky;top:0;background:#f6f8fbee;backdrop-filter:blur(10px);padding:14px 0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:10px;border-radius:8px;background:#dce5ee;flex:1;min-width:100px;overflow:hidden}.fill{height:100%;background:#298b78;width:0;transition:.2s}.pill{background:#e7eef6;border-radius:999px;padding:4px 12px;color:#294768;font-weight:700}.question{background:white;border-radius:16px;margin:14px 0;padding:22px;box-shadow:0 2px 12px #1b355012;border:1px solid #e5eaf0}.question h2{font-size:17px;margin:0 0 14px;color:#254b71}.qbody{white-space:pre-line;font-size:18px;font-weight:550;margin-bottom:15px}.choice{display:flex;align-items:flex-start;gap:12px;border:1px solid #d6dee8;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.choice:hover{background:#f2f8fc}.choice:has(input:checked){background:#e7f3ff;border-color:#397eaf}.choice input{margin-top:7px;accent-color:#236c9c}.choice span{white-space:pre-line}.correct{background:#e7f8ee!important;border-color:#38a16c!important}.incorrect{background:#fff0f0!important;border-color:#df6767!important}.explain{padding:10px 14px;background:#f4f6f9;border-radius:9px;margin-top:12px;font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}button{border:0;border-radius:11px;padding:13px 22px;background:#225e86;color:white;font-size:16px;font-weight:700;cursor:pointer}button.secondary{background:#e3eaf1;color:#2e4f68}button:hover{filter:brightness(.95)}#result{background:white;border-radius:16px;padding:24px;margin:20px 0;box-shadow:0 3px 14px #182c3012}#result[hidden],.explain[hidden]{display:none}.score{font-size:40px;font-weight:800;color:#247b64}footer{color:#627187;font-size:13px} @media(max-width:560px){.shell{padding:10px 10px 40px}.question{padding:16px}.hero{padding:19px}.qbody{font-size:17px}}</style></head><body><main class="shell"><header class="hero"><h1>基礎日語二｜50題線上練習</h1><div class="muted">第1～3課模擬試題｜每題2分｜滿分100分</div></header><div class="toolbar"><span class="pill" id="progressText">已作答 0 / 50 題</span><div class="progress" aria-label="答題進度"><div class="fill" id="bar"></div></div></div><div id="result" hidden aria-live="polite"></div><div id="questions"></div><div class="actions"><button id="submit">完成作答・交卷計分</button><button class="secondary" id="reset">清除答案・重新測驗</button></div><footer>依據上傳之〈基礎日語二大面授①1–3課試題上課用〉製作。第50題原卷僅提供A、B兩個選項；第48題原卷中文與日文用詞存在差異。此測驗在本機瀏覽器運作，不會自動上傳成績。</footer></main><script>const questions=[{"q": "わたし（ ）学生です。", "options": ["の", "は", "か", "も"], "answer": 1, "why": "「は」提示主題：我是學生。"}, {"q": "「我不是公司職員」", "options": ["わたしは会社員です。", "わたしは会社員ですか。", "わたしの会社員です。", "わたしは会社員ではありません。"], "answer": 3, "why": "名詞句的否定用「ではありません」。"}, {"q": "A：キムさんは学生ですか。\nB：はい、（ ）。", "options": ["学生です", "学生ではありません", "会社員です", "会社員ではありません"], "answer": 0, "why": "「はい」肯定問句，回答「学生です」。"}, {"q": "A：あなたは日本人ですか。\nB：いいえ、（ ）。韓国人です。", "options": ["日本人です", "韓国人ではありません", "日本人ではありません", "学生ですか"], "answer": 2, "why": "「いいえ」否定對方的判斷。"}, {"q": "「王先生是學生，金先生也是學生。」\nワンさんは学生です。キムさん（ ）学生です。", "options": ["か", "も", "の", "はい"], "answer": 1, "why": "「も」表示「也」。"}, {"q": "詢問對方年齡。", "options": ["おいくつですか。", "どなたですか。", "なんですか。", "どれですか。"], "answer": 0, "why": "「おいくつですか」是禮貌詢問年齡。"}, {"q": "第一次見面時", "options": ["ありがとうございます。", "いらっしゃいませ。", "これをください。", "はじめまして。"], "answer": 3, "why": "初次見面說「はじめまして」。"}, {"q": "A：あの方はどなたですか。\nB：（ ）。", "options": ["日本です", "21さいです", "山田先生です", "本です"], "answer": 2, "why": "「どなた」詢問人物身分。"}, {"q": "指著自己手上、靠近自己的書，應說：\n（ ）は本です。", "options": ["これ", "それ", "あれ", "どれ"], "answer": 0, "why": "近自己用「これ」。"}, {"q": "指著靠近對方的椅子，應說：\n（ ）はいすです。", "options": ["あれ", "どれ", "これ", "それ"], "answer": 3, "why": "近聽話者用「それ」。"}, {"q": "指著離說話者與聽話者都很遠的電視，應說：\n（ ）はテレビです。", "options": ["それ", "あれ", "これ", "どれ"], "answer": 1, "why": "離雙方都遠用「あれ」。"}, {"q": "A：これはなんですか。\nB：（ ）。", "options": ["わたしです", "台湾です", "辞書です", "19さいです"], "answer": 2, "why": "回答物品名稱「辞書です」。"}, {"q": "A：それは雑誌ですか。\nB：いいえ、（ ）。本です。", "options": ["そうです", "雑誌です", "本ではありません", "ちがいます"], "answer": 3, "why": "「ちがいます」表示「不是／不對」。"}, {"q": "「這是日文課本。」\nこれは日本語（ ）テキストです。", "options": ["は", "の", "も", "か"], "answer": 1, "why": "「の」連接名詞：日語的課本。"}, {"q": "「這是我的手錶。」\nこれは（ ）時計です。", "options": ["わたしの", "わたしは", "わたしも", "わたしか"], "answer": 0, "why": "「わたしの」表示「我的」。"}, {"q": "（ ）かばんはわたしのです。", "options": ["これ", "それ", "この", "どれ"], "answer": 2, "why": "名詞「かばん」前用「この」，不可用「これ」。"}, {"q": "A：その傘は（ ）のですか。\nB：リーさんのです。", "options": ["なん", "だれ", "どれ", "いくら"], "answer": 1, "why": "「だれの」詢問誰的物品。"}, {"q": "桌上有三本書，想問「哪一本是田中先生的書？」應說：\n田中さんの本は（ ）ですか。", "options": ["なん", "だれ", "どこ", "どれ"], "answer": 3, "why": "「どれ」從多個物品中問哪一個。"}, {"q": "表示「這裡是圖書館」，應選哪一句？", "options": ["これは図書館です。", "このは図書館です。", "ここは図書館です。", "どこは図書館です。"], "answer": 2, "why": "「ここ」表示這裡。"}, {"q": "指著離雙方都很遠的食堂，應說：\n（ ）は食堂です。", "options": ["あそこ", "ここ", "そこ", "どこ"], "answer": 0, "why": "遠處的地點使用「あそこ」。"}, {"q": "A：トイレは（ ）ですか。\nB：あちらです。", "options": ["だれ", "なん", "いくら", "どちら"], "answer": 3, "why": "「どちら」禮貌詢問方向或位置。"}, {"q": "「這邊」較禮貌的說法是哪一個？", "options": ["あちら", "こちら", "そちら", "どちら"], "answer": 1, "why": "「こちら」是「こっち」較有禮貌的說法。"}, {"q": "A：郵便局はどこですか。\nB：（ ）。", "options": ["500円です", "日本のです", "あそこです", "田中さんです"], "answer": 2, "why": "地點問句用「あそこです」回答。"}, {"q": "A：あなたの学校はどちらですか。\nB：（ ）。", "options": ["ひまわり日本語学校です", "会社員です", "3,000円です", "22さいです"], "answer": 0, "why": "「どちら」在此詢問學校名稱。"}, {"q": "想詢問相機是哪一國製造的，應說：\nこれは（ ）のカメラですか。", "options": ["だれ", "どこ", "どれ", "いくら"], "answer": 1, "why": "「どこの」可以詢問商品的產地或品牌來源。"}, {"q": "A：これはどこの時計ですか。\nB：（ ）。", "options": ["わたしです", "1階です", "時計です", "日本のです"], "answer": 3, "why": "「日本のです」表示日本的。"}, {"q": "A：このかばんは（ ）ですか。\nB：8,300円です。", "options": ["いくら", "どこ", "だれ", "何階"], "answer": 0, "why": "「いくら」詢問價格。"}, {"q": "A：カメラの売り場は（ ）ですか。\nB：8階です。", "options": ["何時", "いくら", "何階", "何歳"], "answer": 2, "why": "「何階」詢問樓層。"}, {"q": "「300」的正確讀法是哪一個？", "options": ["さんひゃく", "さんびゃく", "さんぴゃく", "さんぜん"], "answer": 1, "why": "300＝さんびゃく，注意音變。"}, {"q": "「600」的正確讀法是哪一個？", "options": ["ろくひゃく", "ろくびゃく", "ろくせん", "ろっぴゃく"], "answer": 3, "why": "600＝ろっぴゃく，注意促音和半濁音。"}, {"q": "「8,000」的正確讀法是哪一個？", "options": ["はっせん", "はちせん", "はっぴゃく", "はちまん"], "answer": 0, "why": "8,000＝はっせん。"}, {"q": "在商店裡想說「請給我這個」，應選哪一句？", "options": ["これはなんですか。", "これはいくらですか。", "これをください。", "これはどこのですか。"], "answer": 2, "why": "「これをください」是購物常用語。"}, {"q": "A：今、（ ）ですか。\nB：午後3時です。", "options": ["何階", "何曜日", "いくら", "何時"], "answer": 3, "why": "「何時」詢問幾點。"}, {"q": "「4時」的正確讀法是哪一個？", "options": ["よんじ", "よじ", "しじ", "よっじ"], "answer": 1, "why": "4時＝よじ。"}, {"q": "「9時」的正確讀法是哪一個？", "options": ["きゅうじ", "きゅじ", "くじ", "ここのじ"], "answer": 2, "why": "9時＝くじ。"}, {"q": "「1分」的正確讀法是哪一個？", "options": ["いっぷん", "いちふん", "いちぷん", "いっふん"], "answer": 0, "why": "1分＝いっぷん。"}, {"q": "「6分」的正確讀法是哪一個？", "options": ["ろくふん", "ろくぷん", "ろっふん", "ろっぷん"], "answer": 3, "why": "6分＝ろっぷん。"}, {"q": "「10時半」表示幾點？", "options": ["10：15", "10：30", "10：45", "11：30"], "answer": 1, "why": "「半」表示半小時。"}, {"q": "「11時5分前」表示幾點？", "options": ["11：05", "11：55", "10：55", "10：05"], "answer": 2, "why": "11點的5分鐘前是10:55。"}, {"q": "想詢問圖書館從幾點開到幾點，應說：\n図書館は何時（ ）何時（ ）ですか。", "options": ["から／まで", "に／の", "まで／から", "の／に"], "answer": 0, "why": "「から～まで」表示從～到～。"}, {"q": "「銀行從上午9點營業到下午3點。」應選哪一句？", "options": ["銀行は午後9時から午前3時までです。", "銀行は午前3時から午後9時までです。", "銀行は午前9時まで午後3時からです。", "銀行は午前9時から午後3時までです。"], "answer": 3, "why": "午前9時から午後3時まで，時間起迄。"}, {"q": "わたしは毎朝7時（ ）起きます。", "options": ["の", "に", "は", "も"], "answer": 1, "why": "具體時刻後加助詞「に」。"}, {"q": "A：学校の休みは（ ）ですか。\nB：土曜日と日曜日です。", "options": ["何曜日", "何時", "何階", "何歳"], "answer": 0, "why": "「何曜日」詢問星期幾。"}, {"q": "「星期四」的日文是哪一個？", "options": ["火曜日", "水曜日", "木曜日", "金曜日"], "answer": 2, "why": "星期四＝木曜日（もくようび）。"}, {"q": "「土曜日（ ）日曜日」表示「星期六和星期日」。", "options": ["に", "から", "まで", "と"], "answer": 3, "why": "「と」連接名詞，表示「和」。"}, {"q": "A：毎晩11時に寝ますか。\nB：いいえ、11時には（ ）。12時に寝ます。", "options": ["寝ます", "寝ません", "寝ました", "寝ませんでした"], "answer": 1, "why": "現在的習慣否定用「寝ません」。"}, {"q": "「きのう」的中文意思是哪一個？", "options": ["明天", "今天", "昨天", "後天"], "answer": 2, "why": "きのう＝昨天。"}, {"q": "「昨天讀了書。」應選哪一句？", "options": ["きのう、勉強しました。", "きのう、勉強します。", "きのう、勉強しません。", "きのう、勉強しませんでした。"], "answer": 0, "why": "依原卷選項，A 是過去肯定形；但「勉強しました」意為「讀書／學習了」，不一定是閱讀書籍。"}, {"q": "A：きのう、働きましたか。\nB：いいえ、（ ）。", "options": ["働きます", "働きました", "働きません", "働きませんでした"], "answer": 3, "why": "「きのう」是過去，否定回答用「ませんでした」。"}, {"q": "A：あした、休みますか。\nB：はい、（ ）。", "options": ["休みました", "休みます"], "answer": 1, "why": "「あした」是明天，肯定用「休みます」。原始PDF第50題僅列A、B兩個選項。"}];const letters='ABCD';let submitted=false;let answers=Array(questions.length).fill(null);const area=document.getElementById('questions');function render(){area.innerHTML='';questions.forEach((q,i)=>{let section=document.createElement('section');section.className='question';section.id='q'+(i+1);let h=document.createElement('h2');h.textContent='第 '+(i+1)+' 題';section.append(h);let body=document.createElement('div');body.className='qbody';body.textContent=q.q;section.append(body);q.options.forEach((opt,j)=>{let label=document.createElement('label');label.className='choice'+(submitted&&j===q.answer?' correct':submitted&&j===answers[i]&&j!==q.answer?' incorrect':'');let inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;inp.checked=answers[i]===j;inp.disabled=submitted;inp.addEventListener('change',()=>{answers[i]=j;update()});let span=document.createElement('span');span.textContent=letters[j]+'. '+opt;label.append(inp,span);section.append(label)});if(submitted){let ex=document.createElement('div');ex.className='explain';ex.textContent='正確答案：'+letters[q.answer]+' ｜ '+q.why;section.append(ex)}area.append(section)});update()};function update(){let count=answers.filter(x=>x!==null).length;document.getElementById('progressText').textContent='已作答 '+count+' / '+questions.length+' 題';document.getElementById('bar').style.width=(count/questions.length*100)+'%'}document.getElementById('submit').onclick=()=>{if(submitted)return;let unanswered=answers.map((x,i)=>x===null?i+1:null).filter(Boolean);if(unanswered.length&&!confirm('還有 '+unanswered.length+' 題尚未作答，確定交卷嗎？'))return;submitted=true;let correct=questions.filter((q,i)=>answers[i]===q.answer).length;let wrong=questions.length-correct;const result=document.getElementById('result');result.hidden=false;result.innerHTML='<div class="score">'+correct*2+' / 100 分</div><p>答對 '+correct+' 題，答錯或未作答 '+wrong+' 題。</p><p>下方已標出正確答案（綠色）、選錯的答案（紅色），並附簡短解析。</p><button class="secondary" id="mistakes">查看錯題</button>';document.getElementById('mistakes').onclick=()=>{let idx=questions.findIndex((q,i)=>answers[i]!==q.answer);document.getElementById('q'+(idx>=0?idx+1:1)).scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('submit').disabled=true;render();result.scrollIntoView({behavior:'smooth'})};document.getElementById('reset').onclick=()=>{if(!confirm('確定清除所有答案，重新測驗？'))return;answers=Array(50).fill(null);submitted=false;document.getElementById('result').hidden=true;document.getElementById('submit').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
